[package]
name = "review-queue"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
graphql_client = "0.16.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jiff = { version = "0.2.38", features = ["serde"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

# The empty-queue image is supersampled; without optimization, a render takes seconds.
[profile.dev]
opt-level = 1
