[package]
name = "review-queue"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
graphql_client = "0.16.0"
jiff = { version = "0.2.38", features = ["serde"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.8"
